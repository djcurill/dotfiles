# set -g @dracula-plugins "battery network network-bandwidth weather"
set -g @plugin 'dracula/tmux'
set -g @dracula-show-farenheit false

unbind C-a
set-option -g prefix C-b
bind-key C-b send-prefix

# use - for vertical split and | for hortizontal
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# resize panes
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R

# rename window
bind r command-prompt "rename-window '%%'"

# enable mouse mode
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# true color support (must be after plugins to override tmux-sensible)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

